# Policy for: .github/workflows/workflow_automation.yml in ddoghq/websites-modules
# (jobs process-clients-for-preview-branches and process-clients-for-main-branch)
issuer: https://token.actions.githubusercontent.com

subject: "repo:ddoghq@230443989/websites-modules@1455615238:pull_request"

permissions:
  contents: write
  pull_requests: write

claim_pattern:
  event_name: "pull_request"
  job_workflow_ref: 'ddoghq/websites-modules/\.github/workflows/workflow_automation\.yml@refs/pull/[0-9]+/merge'
  ref: "refs/pull/[0-9]+/merge"
  ref_type: "branch"
  repository: "ddoghq/websites-modules"
