# Merge module language config (the shared left nav menus in shared/left_nav)
# into every language. Without this, a language gets module menus only if it
# also has menu files in hugo/config/_default/menus/.
_merge: deep

en:
  languageName: "English"
  weight: 1
  outputs:
    home:
      - HTML
      - RSS
      - Search
      - Partners
      - Redirects
      - URLMap
    page:
      - HTML

fr:
  languageName: "Français"
  weight: 2
ja:
  languageName: "日本語"
  weight: 3
ko:
  languageName: "한국어"
  weight: 4
es:
  languageName: "Español"
  weight: 5
