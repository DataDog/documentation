environment: default
# do not delete repo_name, used by websites-modules as context
repo_name: "documentation"
integrations_img_url: "https://static.datadoghq.com/static/images/logos/"
img:
  header_jpg: "?fit=max&fm=jpg&auto=format"
  header_png: "?fit=max&fm=png&auto=format"
  header_gif: "?fm=gif"
  jpg: "?fm=jpg&auto=format"
  png: "?fm=png&auto=format"
  gif: ""
code_languages:
  'py':
    extension: py
    name: python-legacy
    syntax: python
    command: python
    example_file: example.py
  'pybeta':
    extension: py
    name: python
    syntax: python
    command: python3
    example_file: example.py
  'rb':
    extension: rb
    name: ruby-legacy
    syntax: ruby
    command: rb
    example_file: example.rb
  'rbbeta':
    extension: rbbeta
    name: ruby
    syntax: ruby
    command: rb
    example_file: example.rb
  'sh':
    extension: sh
    name: curl
    syntax: curl
  'go':
    extension: go
    name: go
    syntax: go
    command: go run
    example_file: main.go
  'java':
    extension: java
    name: java
    syntax: java
    command: java
    example_file: Example.java
  'cs':
    extension: cs
    name: csharp
    syntax: csharp
  'php':
    extension: php
    name: php
    syntax: php
  'ts':
    extension: ts
    name: typescript
    syntax: typescript
    command: tsc
    example_file: example.ts
  'rs':
    extension: rs
    name: rust
    syntax: rust
    command: rustc
    example_file: src/main.rs

code_language_ids:
    browser: Browser
    android: Android
    ios: iOS
    expo: Expo
    flutter: Flutter
    reactnative: React Native
