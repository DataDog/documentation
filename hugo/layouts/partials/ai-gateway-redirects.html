{{- $redirects := dict -}}
{{- range $anchor, $destination := .Page.Params.legacy_anchors -}}
  {{- $redirects = merge $redirects (dict $anchor (strings.TrimPrefix "/" $destination | absLangURL)) -}}
{{- end -}}
<script>
    (() => {
        const redirects = new Map(Object.entries({{ $redirects | jsonify | safeJS }}));
        const destination = redirects.get(window.location.hash.slice(1));
        if (destination) {
            const target = new URL(destination, window.location.href);
            target.search = window.location.search;
            window.location.replace(target.href);
        }
    })();
</script>
