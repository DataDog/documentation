traits:
- id: api_type
  label: "API"
  type: text
  internal_notes: The instrumentation API type, such as OpenTelemetry API or Datadog native API.

- id: database
  type: text
  label: "데이터베이스"

- id: host
  label: "호스트"
  type: text
  internal_notes: Hosting platform, such as AWS or GCP. Can also refer to containers like Kubernetes.

- id: host_type
  label: "호스트 유형"
  type: text
  internal_notes: The machine or container type within a given host, such as EC2. Use only as a followup to a `host` selection.

- id: lib_src
  label: "소스"
  type: text
  internal_notes: The source of a software library that the customer is trying to use in their code, such as an SDK. This is most often a package manager like NPM. But it could also have a more general value, like "CDN" or "GitHub".

- id: mobile_os
  label: "OS"
  type: text
  internal_notes: Mobile operating system, such as Android.

- id: os
  label: "OS"
  type: text
  internal_notes: Env operating system, such as Linux or Windows. Can refer to a mobile OS, but `mobile_os` is preferred for lists of mobile-only options.

- id: platform
  label: "플랫폼"
  type: text
  internal_notes: The target platform (language, framework, specific env) for a library, SDK, or other third-party entity. Do not use if every option is a pure programming language (Go, Python, etc.) -- use `prog_lang` instead. Re-label to "Framework", "SDK", etc. if it's more appropriate for your context.

- id: product
  label: 제품
  type: text
  internal_notes: On pages that support more than one Datadog product, this trait allows the customer to choose one.

- id: prog_lang
  label: 프로그래밍 언어
  type: text
  internal_notes: Do not use for frameworks like Next or React Native. Instead, use `platform`.

- id: protocol
  label: 프로토콜
  type: text
  internal_notes: For example, HTTP, gRPC, or SOCKS.

- id: cloud_siem_detection_rule_type
  label: "규칙 유형"
  type: text
  internal_notes: The rule type a user wants to use when creating a custom detection rule for Cloud SIEM.

- id: cloud_siem_detection_rule_detection_method
  label: "탐지 방법"
  type: text
  internal_notes: The detection method a user wants to use when creating a custom detection rule for Cloud SIEM.

- id: cloud_siem_detection_rule_query_language
  label: "쿼리 언어"
  type: text
  internal_notes: The search query language a user wants to use when creating a custom detection rule for Cloud SIEM.

- id: cloud_siem_detection_threshold_rule_query_language
  label: "쿼리 언어"
  type: text
  internal_notes: The search query language a user wants to use when creating a custom detection rule for Cloud SIEM, when the search query type is threshold AND the rule type is real-time rule.

- id: cloud_siem_detection_threshold_sql_rule_query_language
  label: "쿼리 언어"
  type: text
  internal_notes: The search query language a user wants to use when creating a custom detection rule for Cloud SIEM, when the search query type is threshold AND the rule type is either scheduled rule or historical job.

- id: cloud_siem_detection_sequence_rule_query_language
  label: "쿼리 언어"
  type: text
  internal_notes: The search query language a user wants to use when creating a custom detection rule for Cloud SIEM, when the search query type is sequence.

- id: interface
  label: 인터페이스
  type: text
  internal_notes: The tool through which the user is performing a task or otherwise accessing Datadog features. For example, web UI, API, CLI, or Terraform.

- id: runtime
  label: "런타임"
  type: text
  internal_notes: The runtime environment, such as JVM or GraalVM Native Image. Used when a language has multiple runtime targets.

- id: secrets_source
  label: 시크릿 소스
  type: text
  internal_notes: The location of the user's sensitive information, such as API keys or other credentials. For example, Secrets Management or environment variables.
