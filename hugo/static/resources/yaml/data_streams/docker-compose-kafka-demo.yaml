      import org.apache.kafka.clients.consumer.*;
      import org.apache.kafka.common.TopicPartition;
      import java.time.Duration;
      import java.util.*;

      public class EventsConsumer {
          private static final long CLIMB_SECONDS = 600;
          private static final long RESOLVE_SECONDS = 30;
          private static final long CYCLE_SECONDS = CLIMB_SECONDS + RESOLVE_SECONDS;

          public static void main(String[] args) {
              Properties props = new Properties();
              props.put("bootstrap.servers", "kafka:19092");
              props.put("group.id", "demo-events-processor");
              props.put("client.id", "events-consumer");
              props.put("auto.offset.reset", "earliest");
              props.put("enable.auto.commit", false);
              props.put("key.deserializer", "org.apache.kafka.common.serialization.ByteArrayDeserializer");
              props.put("value.deserializer", "org.apache.kafka.common.serialization.ByteArrayDeserializer");

              KafkaConsumer<byte[], byte[]> consumer = new KafkaConsumer<>(props);
              consumer.subscribe(List.of("connector-source-events"));

              long cycleStart = System.currentTimeMillis() / 1000;
              long count = 0;
              Deque<ConsumerRecord<byte[], byte[]>> pending = new ArrayDeque<>();

              System.out.println("🚀 Consumer started - processing events...");
              try {
                  while (true) {
                      ConsumerRecords<byte[], byte[]> records = consumer.poll(Duration.ofSeconds(1));
                      for (ConsumerRecord<byte[], byte[]> record : records) {
                          count++;
                          System.out.printf("📬 Message #%d [P%d:%d]%n", count, record.partition(), record.offset());
                          pending.addLast(record);
                      }
                      long elapsed = ((System.currentTimeMillis() / 1000) - cycleStart) % CYCLE_SECONDS;
                      if (elapsed >= CLIMB_SECONDS) {
                          // resolve phase: drain everything so lag falls back toward 0
                          while (!pending.isEmpty()) {
                              ConsumerRecord<byte[], byte[]> oldest = pending.pollFirst();
                              consumer.commitAsync(Map.of(
                                  new TopicPartition(oldest.topic(), oldest.partition()),
                                  new OffsetAndMetadata(oldest.offset() + 1)
                              ), null);
                          }
                      }
                      // else: climb phase - hold all commits back, let pending grow
                  }
              } finally {
                  consumer.close();
              }
          }
      }

