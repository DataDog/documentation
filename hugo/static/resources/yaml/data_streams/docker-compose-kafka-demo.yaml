# Kafka Consumer Integration Demo
#
# Quick Start:
#   DD_API_KEY=your_key_here docker compose up
#
# Optional: Set DD_SITE (defaults to datadoghq.com)
#   DD_API_KEY=xxx DD_SITE=datadoghq.eu docker compose up
#
# This starts:
#   - Kafka (KRaft mode, no ZooKeeper) + Schema Registry
#   - Kafka Connect with an instrumented source and sink connector
#   - Datadog Agent with Kafka Consumer and Kafka Broker integrations
#   - Producer app (sends orders every 2s, APM + Data Streams enabled)
#   - Consumer app (processes orders, APM + Data Streams enabled)
#   - Schema evolver (registers a new schema version every 4 min, renaming field 7 to region_vN)
#   - Second broker (kafka2) + chaos sidecar that pauses/unpauses it on a cycle
#
# View in Datadog (wait 2-3 min):
#  - Navigate to Data Streams Monitoring and view your Kafka cluster & consumer / producer apps.

version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:19092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'Mka3OEVBNTcwNTJENDM2Qk'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    command: >
      bash -c "
      sed -i '/KAFKA_ZOOKEEPER_CONNECT/d' /etc/confluent/docker/configure &&
      /etc/confluent/docker/run
      "
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    hostname: kafka2
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      producer:
        condition: service_started
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka2:19092,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka2:19092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'Mka3OEVBNTcwNTJENDM2Qk'
    command: >
      bash -c "
      sed -i '/KAFKA_ZOOKEEPER_CONNECT/d' /etc/confluent/docker/configure &&
      /etc/confluent/docker/run
      "
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka2:19092"]
      interval: 10s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:19092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:19092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: kafka-connect-demo
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_PLUGIN_PATH: /tmp/connect-plugins,/usr/share/java,/usr/share/confluent-hub-components
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_SERVICE: kafka-connect
      DD_ENV: demo
      DD_VERSION: "7.5.0"
      DD_DATA_STREAMS_ENABLED: "true"
      KAFKA_OPTS: -javaagent:/tmp/dd-java-agent.jar
    command:
      - bash
      - -c
      - |
        set -e
        curl -L --fail --silent --show-error -o /tmp/dd-java-agent.jar https://dtdg.co/latest-java-tracer
        mkdir -p /tmp/connect-plugins
        curl -L --fail --silent --show-error \
          -o /tmp/connect-plugins/connect-file.jar \
          https://repo1.maven.org/maven2/org/apache/kafka/connect-file/3.5.0/connect-file-3.5.0.jar
        touch /tmp/source-records.txt
        /etc/confluent/docker/run &
        connect_pid=$$!
        trap 'kill "$$connect_pid"; wait "$$connect_pid"' TERM INT
        until curl --fail --silent http://localhost:8083/connectors > /dev/null; do sleep 2; done
        curl --fail --silent --show-error -X PUT \
          -H 'Content-Type: application/json' \
          http://localhost:8083/connectors/demo-file-source/config \
          -d '{"connector.class":"org.apache.kafka.connect.file.FileStreamSourceConnector","tasks.max":"1","file":"/tmp/source-records.txt","topic":"connector-source-events","value.converter":"org.apache.kafka.connect.storage.StringConverter"}'
        curl --fail --silent --show-error -X PUT \
          -H 'Content-Type: application/json' \
          http://localhost:8083/connectors/demo-file-sink/config \
          -d '{"connector.class":"org.apache.kafka.connect.file.FileStreamSinkConnector","tasks.max":"1","file":"/tmp/sink-records.txt","topics":"demo-orders"}'
        curl --fail --silent --show-error -X PUT \
          -H 'Content-Type: application/json' \
          http://localhost:8083/connectors/demo-file-sink-broken/config \
          -d '{"connector.class":"org.apache.kafka.connect.file.FileStreamSinkConnector","tasks.max":"1","file":"/proc/1/status/orders-out.txt","topics":"demo-orders"}'
        while kill -0 "$$connect_pid" 2> /dev/null; do
          echo "connector event $$(date +%s)" >> /tmp/source-records.txt
          sleep 2
        done
        wait "$$connect_pid"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 12

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.83.1-jmx
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_HOSTNAME: kafka-demo-agent
      DD_TAGS: "env:demo kafka_cluster:dd-kafka-demo"
      DD_DATA_STREAMS_ENABLED: "true"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOG_LEVEL: "INFO"
      DD_LOGS_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    configs:
      - source: kafka_consumer_config
        target: /etc/datadog-agent/conf.d/kafka_consumer.d/conf.yaml
      - source: kafka_broker_config
        target: /etc/datadog-agent/conf.d/kafka.d/conf.yaml

  producer:
    image: python:3.11-slim
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    environment:
      DD_SERVICE: order-producer
      DD_ENV: demo
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_DATA_STREAMS_ENABLED: "true"
    configs:
      - source: order_proto
        target: /app/order.proto
      - source: producer_script
        target: /app/producer.py
    command: >
      bash -c "
      apt-get update -qq &&
      apt-get install -y -qq gcc g++ librdkafka-dev protobuf-compiler &&
      pip install -q protobuf==3.20.3 confluent-kafka[protobuf]==2.3.0 ddtrace>=2.0.0 &&
      cd /app &&
      protoc --python_out=. order.proto &&
      ddtrace-run python producer.py
      "
    restart: unless-stopped

  topic-config:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      producer:
        condition: service_started
      kafka2:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        until kafka-topics --bootstrap-server kafka:19092 --describe --topic demo-orders > /dev/null 2>&1; do
          sleep 2
        done
        kafka-configs --bootstrap-server kafka:19092 \
          --entity-type topics --entity-name demo-orders \
          --alter --add-config retention.ms=300000
        echo "Set demo-orders retention.ms to 300000 (5 min)"
        until kafka-topics --bootstrap-server kafka:19092 --describe --topic connector-source-events > /dev/null 2>&1; do
          sleep 2
        done
        kafka-configs --bootstrap-server kafka:19092 \
          --entity-type topics --entity-name connector-source-events \
          --alter --add-config retention.ms=180000
        echo "Set connector-source-events retention.ms to 180000 (3 min)"
        if ! kafka-topics --bootstrap-server kafka:19092 --list | grep -q '^demo-offline-test$$'; then
          if kafka-topics --bootstrap-server kafka:19092 \
              --create --topic demo-offline-test \
              --replica-assignment 2,2,2; then
            echo "Created demo-offline-test with all partitions on broker 2"
          else
            echo "Failed to create demo-offline-test" >&2
            exit 1
          fi
        else
          echo "demo-offline-test already exists"
        fi
    restart: "no"

  consumer:
    image: maven:3.9-eclipse-temurin-17
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    environment:
      DD_SERVICE: order-consumer
      DD_ENV: demo
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_DATA_STREAMS_ENABLED: "true"
    configs:
      - source: java_consumer_pom
        target: /app/pom.xml
      - source: order_consumer_java
        target: /app/src/main/java/OrderConsumer.java
      - source: events_consumer_java
        target: /app/src/main/java/EventsConsumer.java
    command: >
      bash -c "
      curl -L --fail --silent --show-error -o /tmp/dd-java-agent.jar https://dtdg.co/latest-java-tracer &&
      cd /app &&
      mvn -q package &&
      exec java -javaagent:/tmp/dd-java-agent.jar -cp target/kafka-consumers-1.0.0-jar-with-dependencies.jar OrderConsumer
      "
    restart: unless-stopped

  events-consumer:
    image: maven:3.9-eclipse-temurin-17
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    environment:
      DD_SERVICE: events-consumer
      DD_ENV: demo
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_DATA_STREAMS_ENABLED: "true"
    configs:
      - source: java_consumer_pom
        target: /app/pom.xml
      - source: order_consumer_java
        target: /app/src/main/java/OrderConsumer.java
      - source: events_consumer_java
        target: /app/src/main/java/EventsConsumer.java
    command: >
      bash -c "
      curl -L --fail --silent --show-error -o /tmp/dd-java-agent.jar https://dtdg.co/latest-java-tracer &&
      cd /app &&
      mvn -q package &&
      exec java -javaagent:/tmp/dd-java-agent.jar -cp target/kafka-consumers-1.0.0-jar-with-dependencies.jar EventsConsumer
      "
    restart: unless-stopped

  schema-evolver:
    image: python:3.11-slim
    depends_on:
      schema-registry:
        condition: service_healthy
      producer:
        condition: service_started
    configs:
      - source: schema_evolver_script
        target: /app/schema_evolver.py
    command: >
      bash -c "
      cd /app &&
      python schema_evolver.py
      "
    restart: unless-stopped

  chaos:
    image: docker:cli
    container_name: kafka-chaos
    depends_on:
      topic-config:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        TRIGGER_SECONDS=300
        RESOLVE_SECONDS=420

        sleep 30
        while true; do
          echo "Pausing kafka2 - offline partitions should fire"
          docker pause kafka2 || true
          sleep $$TRIGGER_SECONDS
          echo "Unpausing kafka2 - offline partitions should resolve"
          docker unpause kafka2 || true
          sleep $$RESOLVE_SECONDS
        done
    restart: unless-stopped

configs:
  kafka_consumer_config:
    content: |
      init_config:

      instances:
        - kafka_connect_str: "kafka:19092"
          enable_cluster_monitoring: true
          kafka_connect_url: http://kafka-connect:8083
          schema_registry_url: http://schema-registry:8081
          tags:
            - env:demo
            - cluster:kafka-demo

  kafka_broker_config:
    content: |
      init_config:
        is_jmx: true
        collect_default_metrics: true

      instances:
        - host: kafka
          port: 9999
          tags:
            - env:demo
            - cluster:kafka-demo
            - kafka_cluster_id:Mka3OEVBNTcwNTJENDM2Qg

  order_proto:
    content: |
      syntax = "proto3";
      package ecommerce;
      message Order {
        string order_id = 1;
        string customer_id = 2;
        string product_name = 3;
        int32 quantity = 4;
        double price = 5;
        double total_amount = 6;
        string region = 7;
        int64 timestamp = 8;
      }

  producer_script:
    content: |
      #!/usr/bin/env python3
      import os, time, random
      from confluent_kafka import Producer
      from confluent_kafka.serialization import SerializationContext, MessageField
      from confluent_kafka.schema_registry import SchemaRegistryClient
      from confluent_kafka.schema_registry.protobuf import ProtobufSerializer
      from ddtrace import tracer, patch
      patch(kafka=True)
      from order_pb2 import Order

      PRODUCTS = [('laptop', 999.99), ('mouse', 29.99), ('keyboard', 79.99), ('monitor', 299.99)]
      CUSTOMERS = ['alice', 'bob', 'charlie', 'diana']
      REGIONS = ['us-east', 'us-west', 'eu-central']

      def delivery_report(err, msg):
          if err: print(f'❌ Delivery failed: $${err}')
          else: print(f'✅ Order delivered to $${msg.topic()} [$${msg.partition()}] offset $${msg.offset()}')

      schema_client = SchemaRegistryClient({'url': 'http://schema-registry:8081'})
      serializer = ProtobufSerializer(Order, schema_client, {'use.deprecated.format': False})
      producer = Producer({'bootstrap.servers': 'kafka:19092', 'client.id': 'order-producer'})

      print("🚀 Producer started - sending orders every 2 seconds...")
      count = 0
      try:
          while True:
              with tracer.trace("produce.order", service="order-producer"):
                  product, price = random.choice(PRODUCTS)
                  qty = random.randint(1, 5)
                  order = Order(
                      order_id=f"ORD-$${int(time.time()*1000)}",
                      customer_id=random.choice(CUSTOMERS),
                      product_name=product, quantity=qty, price=price,
                      total_amount=price*qty, region=random.choice(REGIONS),
                      timestamp=int(time.time())
                  )
                  count += 1
                  print(f"📦 Order #$${count}: $${order.order_id} | $${order.customer_id} | $${product} x$${qty} | $$$${order.total_amount:.2f}")
                  ctx = SerializationContext('demo-orders', MessageField.VALUE)
                  producer.produce('demo-orders', key=order.customer_id.encode('utf-8'),
                                 value=serializer(order, ctx), on_delivery=delivery_report)
                  producer.poll(0)
              time.sleep(2)
      except KeyboardInterrupt:
          print("\n🛑 Shutting down...")
      finally:
          producer.flush()

  java_consumer_pom:
    content: |
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <groupId>com.demo</groupId>
        <artifactId>kafka-consumers</artifactId>
        <version>1.0.0</version>
        <properties>
          <maven.compiler.source>17</maven.compiler.source>
          <maven.compiler.target>17</maven.compiler.target>
          <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
        </properties>
        <repositories>
          <repository>
            <id>confluent</id>
            <url>https://packages.confluent.io/maven/</url>
          </repository>
        </repositories>
        <dependencies>
          <dependency>
            <groupId>org.apache.kafka</groupId>
            <artifactId>kafka-clients</artifactId>
            <version>3.5.0</version>
          </dependency>
          <dependency>
            <groupId>io.confluent</groupId>
            <artifactId>kafka-protobuf-serializer</artifactId>
            <version>7.5.0</version>
          </dependency>
        </dependencies>
        <build>
          <plugins>
            <plugin>
              <artifactId>maven-assembly-plugin</artifactId>
              <version>3.6.0</version>
              <configuration>
                <descriptorRefs>
                  <descriptorRef>jar-with-dependencies</descriptorRef>
                </descriptorRefs>
              </configuration>
              <executions>
                <execution>
                  <phase>package</phase>
                  <goals><goal>single</goal></goals>
                </execution>
              </executions>
            </plugin>
          </plugins>
        </build>
      </project>

  order_consumer_java:
    content: |
      import com.google.protobuf.DynamicMessage;
      import com.google.protobuf.Descriptors;
      import io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializer;
      import io.confluent.kafka.serializers.protobuf.KafkaProtobufDeserializerConfig;
      import org.apache.kafka.clients.consumer.*;
      import org.apache.kafka.common.TopicPartition;
      import java.time.Duration;
      import java.util.*;

      public class OrderConsumer {
          private static final long CLIMB_SECONDS = 330;
          private static final long RESOLVE_SECONDS = 30;
          private static final long CYCLE_SECONDS = CLIMB_SECONDS + RESOLVE_SECONDS;

          public static void main(String[] args) throws Exception {
              Properties props = new Properties();
              props.put("bootstrap.servers", "kafka:19092");
              props.put("group.id", "demo-order-processor");
              props.put("client.id", "order-consumer");
              props.put("auto.offset.reset", "earliest");
              props.put("enable.auto.commit", false);
              props.put("key.deserializer", "org.apache.kafka.common.serialization.StringDeserializer");
              props.put("value.deserializer", KafkaProtobufDeserializer.class.getName());
              props.put(KafkaProtobufDeserializerConfig.SCHEMA_REGISTRY_URL_CONFIG, "http://schema-registry:8081");

              KafkaConsumer<String, DynamicMessage> consumer = new KafkaConsumer<>(props);
              consumer.subscribe(List.of("demo-orders"));

              long cycleStart = System.currentTimeMillis() / 1000;
              long count = 0;
              Deque<ConsumerRecord<String, DynamicMessage>> pending = new ArrayDeque<>();

              System.out.println("🚀 Consumer started - processing orders...");
              try {
                  while (true) {
                      ConsumerRecords<String, DynamicMessage> records = consumer.poll(Duration.ofSeconds(1));
                      for (ConsumerRecord<String, DynamicMessage> record : records) {
                          count++;
                          DynamicMessage order = record.value();
                          System.out.printf("📬 Message #%d [P%d:%d]%n", count, record.partition(), record.offset());
                          pending.addLast(record);

                          Thread.sleep(100);
                          double total = getDouble(order, "total_amount");
                          if (total > 500) Thread.sleep(300);
                          System.out.printf("✅ Processed %s | %s | $%.2f%n",
                              getString(order, "order_id"), getString(order, "customer_id"), total);
                      }

                      long elapsed = ((System.currentTimeMillis() / 1000) - cycleStart) % CYCLE_SECONDS;
                      if (elapsed >= CLIMB_SECONDS) {
                          // resolve phase: drain everything so lag falls back toward 0
                          while (!pending.isEmpty()) {
                              ConsumerRecord<String, DynamicMessage> oldest = pending.pollFirst();
                              consumer.commitAsync(Map.of(
                                  new TopicPartition(oldest.topic(), oldest.partition()),
                                  new OffsetAndMetadata(oldest.offset() + 1)
                              ), null);
                          }
                      }
                      // else: climb phase - hold all commits back, let pending grow
                  }
              } finally {
                  consumer.close();
              }
          }

          private static String getString(DynamicMessage m, String field) {
              Descriptors.FieldDescriptor f = m.getDescriptorForType().findFieldByName(field);
              return f == null ? "" : (String) m.getField(f);
          }
          private static double getDouble(DynamicMessage m, String field) {
              Descriptors.FieldDescriptor f = m.getDescriptorForType().findFieldByName(field);
              return f == null ? 0.0 : (double) m.getField(f);
          }
      }

  schema_evolver_script:
    content: |
      #!/usr/bin/env python3
      import json, time, urllib.error, urllib.request

      REGISTRY = 'http://schema-registry:8081'
      SUBJECT = 'demo-orders-value'
      CYCLE_SECONDS = 240

      def build_schema(n):
          return (
              'syntax = "proto3";\n'
              'package ecommerce;\n'
              'message Order {\n'
              '  string order_id = 1;\n'
              '  string customer_id = 2;\n'
              '  string product_name = 3;\n'
              '  int32 quantity = 4;\n'
              '  double price = 5;\n'
              '  double total_amount = 6;\n'
              f'  string region_v{n} = 7;\n'
              '  int64 timestamp = 8;\n'
              '}\n'
          )

      def wait_for_initial_registration():
          for _ in range(120):
              try:
                  with urllib.request.urlopen(f'{REGISTRY}/subjects/{SUBJECT}/versions', timeout=3) as r:
                      versions = json.loads(r.read())
                      if versions:
                          print(f'Producer registered v1, evolving from: {versions}', flush=True)
                          return
              except (urllib.error.URLError, urllib.error.HTTPError):
                  pass
              time.sleep(2)
          print('Producer never registered v1, evolving anyway', flush=True)

      def register(n):
          body = json.dumps({'schemaType': 'PROTOBUF', 'schema': build_schema(n)}).encode('utf-8')
          req = urllib.request.Request(
              f'{REGISTRY}/subjects/{SUBJECT}/versions',
              data=body,
              headers={'Content-Type': 'application/vnd.schemaregistry.v1+json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  schema_id = json.loads(r.read()).get('id')
                  print(f'📝 Rename #{n} registered (field 7 -> region_v{n}): schema_id={schema_id}', flush=True)
          except urllib.error.HTTPError as e:
              print(f'Rename #{n} rejected: {e.code} {e.read().decode()}', flush=True)
          except urllib.error.URLError as e:
              print(f'Rename #{n} error: {e}', flush=True)

      def main():
          wait_for_initial_registration()
          n = 1
          while True:
              time.sleep(CYCLE_SECONDS)
              register(n)
              n += 1

      if __name__ == '__main__':
          main()

