# Datadog feature support for each OpenTelemetry setup.
# Rendered by the `otel-compatibility` Hugo shortcode on /opentelemetry/compatibility/.
# Schema and editing guide: shared/README.md, section `otel_compatibility.yaml`.
#
# Seeded from the feature table on the compatibility page. Values the table did
# not state are `unknown` and render as blank cells (not yet documented).

sdks:
  - id: ddot_sdk
    label: DDOT SDK
    description: The Datadog SDK for your language, set to send OTLP to your Collector.
    apis: Datadog API or OpenTelemetry API
    link: /opentelemetry/instrument/dd_sdks/ddot_setup/
  - id: datadog_sdk
    label: Datadog SDK
    description: The Datadog SDK for your language, sending data to the Datadog Agent.
    apis: Datadog API or OpenTelemetry API
    link: /tracing/trace_collection/
  - id: otel_sdk
    label: OpenTelemetry SDK
    description: The upstream OpenTelemetry SDK for your language.
    apis: OpenTelemetry API
    link: /opentelemetry/instrument/otel_sdks/

receivers:
  - id: ddot_collector
    label: DDOT Collector
    description: An OpenTelemetry Collector that Datadog builds and supports.
    agent: optional
    link: /opentelemetry/setup/ddot_collector/
  - id: upstream_collector
    label: Upstream OpenTelemetry Collector
    description: The OpenTelemetry Collector Contrib distribution, sending to Datadog over OTLP.
    agent: none
    link: /opentelemetry/setup/collector_exporter/
  - id: agents_collector
    label: Agent's Collector
    description: An OpenTelemetry Collector that runs alongside the Datadog Agent.
    agent: included
    link: /opentelemetry/setup/agent/#agents-collector
  - id: otlp_ingest_agent
    label: Agent's OTLP endpoint
    description: The Datadog Agent receives OTLP from your applications, with no Collector.
    agent: included
    link: /opentelemetry/setup/otlp_ingest_in_the_agent/
  - id: otlp_intake
    label: Direct OTLP intake
    description: Your applications send OTLP straight to Datadog, with no Collector or Agent.
    agent: none
    link: /opentelemetry/setup/otlp_ingest/

# Sections of the feature table, in display order.
groups:
  - id: apm
    label: APM
  - id: infrastructure
    label: Infrastructure
  - id: security
    label: Security
  - id: other
    label: Other products

# Valid SDK and receiver combinations, in display order. Any pair not listed
# here is disabled in the setup picker.
pairs:
  - sdk: ddot_sdk
    receiver: ddot_collector
    name: DDOT
    recommended: true
    link: /opentelemetry/setup/ddot_collector/
  - sdk: otel_sdk
    receiver: upstream_collector
    name: Upstream
    recommended: true
    link: /opentelemetry/setup/collector_exporter/
  - sdk: datadog_sdk
    receiver: agents_collector
    link: /opentelemetry/setup/agent/#agents-collector
  - sdk: otel_sdk
    receiver: agents_collector
    link: /opentelemetry/setup/agent/#agents-collector
  - sdk: otel_sdk
    receiver: otlp_intake
    link: /opentelemetry/setup/otlp_ingest/
  - sdk: otel_sdk
    receiver: ddot_collector
    link: /opentelemetry/setup/ddot_collector/
  - sdk: otel_sdk
    receiver: otlp_ingest_agent
    link: /opentelemetry/setup/otlp_ingest_in_the_agent/
  - sdk: ddot_sdk
    receiver: upstream_collector
    link: /opentelemetry/instrument/dd_sdks/ddot_setup/
  # The DDOT SDK sends OTLP, so these receivers may work. Not confirmed.
  - sdk: ddot_sdk
    receiver: agents_collector
    confirmed: false
  - sdk: ddot_sdk
    receiver: otlp_ingest_agent
    confirmed: false
  - sdk: ddot_sdk
    receiver: otlp_intake
    confirmed: false

features:
  - id: distributed_tracing
    label: Distributed Tracing
    group: apm
    link: /tracing/trace_collection/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: span_links
    label: Span Links
    group: apm
    link: /tracing/trace_collection/span_links/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: trace_metrics
    label: Trace Metrics
    group: apm
    link: /tracing/metrics/metrics_namespace/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake:
        support: partial
        label: Sampled
        note: Calculated from spans that reach Datadog; reflects any OTel-side sampling you configure.

  - id: runtime_metrics
    label: Runtime Metrics
    group: apm
    link: /tracing/metrics/runtime_metrics/
    sdk:
      datadog_sdk:
        support: supported
        note: Sent with DogStatsD (UDP port 8125). Turn on DogStatsD in the Agent.
      otel_sdk:
        support: supported
        note: Follows the OpenTelemetry runtime metrics specification. Sent with OTLP (port 4317 or 4318).
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: correlated_telemetry
    label: Correlated Traces, Metrics, Logs
    group: apm
    link: /opentelemetry/correlate/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: continuous_profiler
    label: Continuous Profiler
    group: apm
    link: /profiler/
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
    overrides:
      - sdk: otel_sdk
        receiver: upstream_collector
        support: not_supported
      - sdk: otel_sdk
        receiver: otlp_intake
        support: not_supported

  - id: source_code_integration
    label: Source code integration
    group: apm
    link: /integrations/guide/source-code-integration/
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
    overrides:
      - sdk: otel_sdk
        receiver: upstream_collector
        support: not_supported
      - sdk: otel_sdk
        receiver: otlp_intake
        support: not_supported

  - id: database_monitoring
    label: Database Monitoring
    group: apm
    abbr: DBM
    link: /opentelemetry/correlate/dbm_and_traces/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: not_supported
      otlp_intake: not_supported

  - id: data_streams_monitoring
    label: Data Streams Monitoring
    group: apm
    abbr: DSM
    link: /data_streams/
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
      upstream_collector:
        support: not_supported
        label: N/A
        note: OTel does not offer DSM functionality.
      otlp_intake:
        support: not_supported
        label: N/A
        note: OTel does not offer DSM functionality.

  - id: infrastructure_host_list
    label: Infrastructure Host List
    group: infrastructure
    link: /infrastructure/list/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: not_supported

  - id: kubernetes_monitoring
    label: Kubernetes Monitoring
    group: infrastructure
    link: /containers/monitoring/kubernetes_explorer/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: not_supported

  - id: live_container_monitoring
    label: Live Container Monitoring
    group: infrastructure
    link: /containers/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: not_supported
      otlp_intake: not_supported

  - id: live_processes
    label: Live Processes
    group: infrastructure
    link: /infrastructure/process/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: not_supported
      otlp_intake: not_supported

  - id: cloud_network_monitoring
    label: Cloud Network Monitoring
    group: infrastructure
    abbr: CNM
    link: /network_monitoring/performance/
    note: Span-level or endpoint-level monitoring is not supported.
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: not_supported
      otlp_intake: not_supported

  - id: universal_service_monitoring
    label: Universal Service Monitoring
    group: infrastructure
    abbr: USM
    link: /universal_service_monitoring/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: not_supported
      otlp_intake: not_supported

  - id: cloud_siem
    label: Cloud SIEM
    group: security
    link: /security/cloud_siem/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: app_and_api_protection
    label: App and API Protection
    group: security
    abbr: AAP
    link: /security/application_security/
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
    overrides:
      - sdk: otel_sdk
        receiver: upstream_collector
        support: not_supported
      - sdk: otel_sdk
        receiver: otlp_intake
        support: not_supported

  - id: real_user_monitoring
    label: Real User Monitoring
    group: other
    abbr: RUM
    link: /opentelemetry/correlate/rum_and_traces/?tab=browserrum#opentelemetry-support
    note: To turn on full RUM functionality, inject supported headers to correlate RUM and traces.
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
    overrides:
