        support: not_supported

  - id: agent_observability
    label: Agent Observability
    group: other
    link: /llm_observability/instrument/otel_instrumentation/
    sdk:
      datadog_sdk: supported
      otel_sdk: supported
    receiver:
      agents_collector: supported
      upstream_collector: supported
      otlp_intake: supported

  - id: data_jobs_monitoring
    label: "Data Observability: Jobs Monitoring"
    group: other
    abbr: DJM
    link: /data_jobs/
    sdk:
      datadog_sdk: supported
      otel_sdk: not_supported
    receiver:
      agents_collector: supported
    overrides:
      - sdk: otel_sdk
        receiver: upstream_collector
        support: not_supported
      - sdk: otel_sdk
        receiver: otlp_intake
        support: not_supported
