# Datadog region (data center) definitions — single source of truth.
#
# Consumed by Astro via the `@shared` alias. Hugo will mount this as data
# after the Astro API docs ship; until then Hugo keeps its own copy in
# hugo/config/_default/params.yaml and hugo/assets/scripts/config/regions.config.js.
#
# To add a data center, add one block below. Nothing else in Astro should
# need editing — see astro/src/config/regions.ts and the generated CSS in
# astro/src/layouts/BaseLayout.astro.
#
# Fields:
#   key           region key used in the `site` cookie and `?site=` query param
#   label         display name shown in the region selector
#   weight        sort order in the selector (lower first)
#   domain        API site domain; matches the OpenAPI spec `site` enum
#   exact_domains fully-qualified hosts that map to this region (oncall,
#                 browser-intake). Used when a spec enum lists whole hostnames
#                 instead of bare site domains.
#   values        per-region substitution values (was regions.config.js)

